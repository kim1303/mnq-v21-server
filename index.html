<style>
div[style*="Powered by Netlify"], a[href*="netlify.com"] div, [data-netlify-badge] { display:none !important; }
iframe[src*="netlify"] { display:none !important; }
</style>
<script>
  try{
    if(window.Telegram && window.Telegram.WebApp){
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      document.documentElement.style.background="#0f0f11";
      document.body.style.background="#0f0f11";
    }
  }catch(e){ console.log("Telegram WebApp not available", e); }
  window.addEventListener('load', function(){
    setTimeout(function(){ window.scrollTo(0,0); document.documentElement.scrollTop=0; document.body.scrollTop=0; }, 100);
  });
</script>



<script>
(function(){
  function removeNetlifyBadge(){
    try{
      var selectors = ['#netlify-badge','.netlify-badge','[id*="netlify"]','[class*="netlify-badge"]','iframe[src*="netlify"]','div[data-netlify-badge]'];
      selectors.forEach(function(sel){
        document.querySelectorAll(sel).forEach(function(el){ el.remove(); });
      });
      // 텍스트로 찾기
      document.querySelectorAll('div,a,span').forEach(function(el){
        if(el.textContent && el.textContent.indexOf('Powered by Netlify')>-1){
          var p=el; 
          for(var i=0;i<4;i++){ 
            if(!p) break; 
            if(p.tagName==='A' || (p.id && p.id.toLowerCase().indexOf('netlify')>-1) || (p.className && typeof p.className==='string' && p.className.toLowerCase().indexOf('netlify')>-1)){
              p.remove(); break;
            }
            p=p.parentElement;
          }
        }
      });
    }catch(e){}
  }
  // 즉시, 로드 후, 주기적으로 제거
  removeNetlifyBadge();
  window.addEventListener('load', removeNetlifyBadge);
  setInterval(removeNetlifyBadge, 1000);
  // MutationObserver로 새로 생기면 즉시 제거
  try{
    var obs=new MutationObserver(removeNetlifyBadge);
    obs.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
</script>



<script>
(function(){
  const BADGE_TEXT = 'Powered by Netlify';
  function isNetlifyBadge(el){
    if(!el || el.id==='root') return false;
    try{
      const id = (el.id||'').toLowerCase();
      const cls = (typeof el.className==='string'?el.className:'').toLowerCase();
      if(id.includes('netlify') || cls.includes('netlify')) return true;
      const href = el.getAttribute && el.getAttribute('href');
      if(href && href.toLowerCase().includes('netlify.com')) return true;
      const src = el.getAttribute && el.getAttribute('src');
      if(src && src.toLowerCase().includes('netlify')) return true;
      const txt = (el.textContent||'').trim();
      if(txt.includes(BADGE_TEXT) || txt.includes('Powered by Netlify')) return true;
      // Check children
      if(el.querySelector && el.querySelector('*')){
        const inner = el.innerText||el.textContent||'';
        if(inner.includes(BADGE_TEXT)) return true;
      }
    }catch(e){}
    return false;
  }
  function removeAllBadges(){
    try{
      // Check direct body children (where Netlify injects)
      Array.from(document.body.children).forEach(function(child){
        if(child.id==='root') return;
        if(isNetlifyBadge(child)){
          child.remove();
        }
      });
      // Check all elements containing the text
      const all = document.querySelectorAll('div, a, span, iframe, section');
      all.forEach(function(el){
        if(el.id==='root') return;
        if(isNetlifyBadge(el)){
          // Don't remove if it's inside #root (our app)
          if(document.getElementById('root') && document.getElementById('root').contains(el)){
            // Only remove if it's the badge itself, not parent containing app
            if((el.textContent||'').trim()===BADGE_TEXT || (el.textContent||'').includes(BADGE_TEXT) && el.children.length<=2){
              // Check if this element is outside or is the badge pill
              const style = window.getComputedStyle(el);
              if(style.position==='fixed' || (el.parentElement && el.parentElement!==document.getElementById('root'))){
                el.remove();
              }
            }
          } else {
            el.remove();
          }
        }
      });
      // Aggressive: hide any fixed bottom-right element
      document.querySelectorAll('[style*="fixed"]').forEach(function(el){
        if(el.id==='root') return;
        const s = (el.getAttribute('style')||'').toLowerCase();
        if(s.includes('bottom') && s.includes('right') && s.includes('fixed')){
          if(isNetlifyBadge(el) || (el.textContent||'').includes('Powered')){
            el.remove();
          }
        }
      });
    }catch(e){ console.log('remove error', e); }
  }
  // Run immediately and repeatedly
  removeAllBadges();
  window.addEventListener('DOMContentLoaded', removeAllBadges);
  window.addEventListener('load', function(){ 
    removeAllBadges(); 
    setTimeout(removeAllBadges, 500);
    setTimeout(removeAllBadges, 1500);
    setTimeout(removeAllBadges, 3000);
  });
  setInterval(removeAllBadges, 800);
  // Watch for new nodes
  try{
    const obs = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeType===1){
            if(isNetlifyBadge(node)){
              node.remove();
            } else if(node.querySelectorAll){
              // Check children of added node
              node.querySelectorAll('*').forEach(function(child){
                if(isNetlifyBadge(child)) child.remove();
              });
              if(isNetlifyBadge(node)) node.remove();
            }
          }
        });
      });
    });
    obs.observe(document.body, {childList:true, subtree:true});
    obs.observe(document.documentElement, {childList:true, subtree:true});
  }catch(e){}
})();
</script>

#netlify-badge, .netlify-badge, #netlify-drawer, .netlify-drawer,
div[id*="netlify" i], div[class*="netlify" i], 
a[href*="netlify.com" i], iframe[src*="netlify" i],
div[data-netlify-badge] {
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}
</style>
<script>
(function(){
  const BADGE_TEXT = 'Powered by Netlify';
  function isBadge(el){
    if(!el || el.id==='root') return false;
    try{
      const id=(el.id||'').toLowerCase();
      const cls=(typeof el.className==='string'?el.className:'').toLowerCase();
      if(id.includes('netlify') || cls.includes('netlify')) return true;
      const txt=(el.textContent||'').trim();
      if(txt.includes(BADGE_TEXT)) return true;
    }catch(e){}
    return false;
  }
  function removeBadges(){
    try{
      document.querySelectorAll('#netlify-badge, .netlify-badge, #netlify-drawer, iframe[src*="netlify" i], a[href*="netlify.com" i], div[data-netlify-badge]').forEach(function(el){
        if(el.id!=='root') el.remove();
      });
      Array.from(document.body.children).forEach(function(child){
        if(child.id==='root') return;
        if(isBadge(child)) child.remove();
      });
    }catch(e){}
  }
  // 3번만 실행 - 부하 0
  removeBadges();
  window.addEventListener('DOMContentLoaded', removeBadges);
  window.addEventListener('load', function(){ 
    removeBadges();
    setTimeout(removeBadges, 800);
  });
  // 새로 생길 때만 동작 (폴링 없음)
  try{
    const obs = new MutationObserver(function(muts){
      let need=false;
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType===1 && isBadge(n)) need=true;
        });
      });
      if(need) removeBadges();
    });
    obs.observe(document.body, {childList:true});
  }catch(e){}
})();
</script>

<script>
(function(){
  function hideModal(){let m=document.getElementById('customStopModal');if(m)m.style.display='none';}
  function execStop(){
    try{
      if(window._appSetters && window._appSetters.execStop){window._appSetters.execStop();}
      hideModal();
      setTimeout(function(){ window.scrollTo({top:0, left:0, behavior:'smooth'}); document.documentElement.scrollTop=0; document.body.scrollTop=0; }, 80);
    }catch(err){console.error('execStop error',err);hideModal(); setTimeout(function(){ window.scrollTo({top:0, left:0, behavior:'smooth'}); document.documentElement.scrollTop=0; document.body.scrollTop=0; }, 80);}
  }
  document.addEventListener('click', function(e){
    if(!e.target) return;
    if(e.target.id==='customStopExecute'){execStop();}
    if(e.target.id==='customStopCancel' || e.target.id==='customStopCloseX'){hideModal();}
  });
  let modal=document.getElementById('customStopModal');
  if(modal){
    modal.addEventListener('click', function(e){if(e.target===modal) hideModal();});
  }
})();
</script>

<!-- TELEGRAM REAL TRADE LINKAGE - 5 PRINCIPLES + TELEGRAM AUTO NAME RECOGNITION (레이아웃 변형 없음) -->
<script>
(function(){
  const REAL_NPOINT_ID = "04ac6b88e333695ed90b";
  const REAL_NPOINT_URL = "https://api.npoint.io/" + REAL_NPOINT_ID;
  const REAL_TELEGRAM_CHANNEL = "-1004340608403";
  const REAL_ADMIN_ID = "180140468603";
  const REAL_SYMBOL = "MNQM26";
  const REAL_POINT_VALUE = 2;
  const REAL_FEE = 30;
  const REAL_ACCOUNT = "7020-3101";
  // REAL_USER_ID는 Telegram ID가 있으면 자동 교체
  let REAL_USER_ID = "USER_1";

  // ===== 0. Telegram WebApp API 자동 이름 인식 (입력 없이) =====
  window.TELEGRAM_USER_INFO = null;
  function getTelegramUserInfo(){
    try{
      const tg = window.Telegram?.WebApp;
      if(tg){
        try{ tg.ready(); tg.expand(); }catch(e){}
        const u = tg.initDataUnsafe?.user;
        if(u){
          const first = u.first_name || "";
          const last = u.last_name || "";
          const username = u.username ? "@"+u.username : "";
          const realName = (first + (last ? " " + last : "")).trim();
          const displayName = realName || username || "User";
          const info = {
            id: u.id,
            telegram_id: u.id,
            first_name: first,
            last_name: last,
            username: u.username || "",
            username_with_at: username,
            real_name: realName || username || "User",
            nickname: username || realName,
            displayName: displayName,
            language_code: u.language_code || "ko",
            is_premium: !!u.is_premium,
            raw: u
          };
          window.TELEGRAM_USER_INFO = info;
          // USER_ID를 실제 telegram_id로 교체 - 자동 인식
          if(u.id) REAL_USER_ID = "TG_" + u.id;
          localStorage.setItem("MNQ_TELEGRAM_USER_INFO", JSON.stringify(info));
          localStorage.setItem("MNQ_TELEGRAM_USER_ID", REAL_USER_ID);
          console.log("[텔레그램] 자동 인식 성공:", info);
          // 화면에 표시 패치
          patchUserNameDisplay(info);
          return info;
        }
      }
      // fallback - localStorage 캐시
      const cached = localStorage.getItem("MNQ_TELEGRAM_USER_INFO");
      if(cached){
        const info = JSON.parse(cached);
        window.TELEGRAM_USER_INFO = info;
        if(info.telegram_id) REAL_USER_ID = "TG_" + info.telegram_id;
        patchUserNameDisplay(info);
        return info;
      }
    }catch(e){ console.warn("Telegram user info 실패", e); }
    // 브라우저 미리보기 fallback
    const fallback = { id: null, telegram_id: null, first_name:"", last_name:"", username:"", real_name:"User", nickname:"User", displayName:"User" };
    window.TELEGRAM_USER_INFO = fallback;
    return fallback;
  }

  function patchUserNameDisplay(info){
    try{
      // 매매확인 버튼, User 표시 등 모든 곳을 실제 이름으로 교체
      const name = info.displayName || info.real_name || info.nickname || "User";
      // 전역 노출
      window.TELEGRAM_DISPLAY_NAME = name;
      // 1초마다 DOM 스캔해서 User 텍스트를 실제 이름으로 교체 (React 앱 대응)
      const replaceUserText = ()=>{
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        let node;
        while(node = walker.nextNode()){
          if(node.nodeValue && node.nodeValue.trim()==="User"){
            // 부모가 버튼/타이틀일 때만 교체 - 매매확인 영역
            const parent = node.parentElement;
            if(parent && (parent.textContent.includes("매매") || parent.textContent.includes("User") || parent.tagName==="BUTTON" || parent.tagName==="SPAN" || parent.tagName==="DIV")){
              // React 앱 내부 User 라벨만 교체 - 정확도 높이기 위해 주변 텍스트 체크
              if(parent.closest && (parent.closest('#root') || document.getElementById('root')?.contains(parent))){
                // User 단독 표시일 때만 실제 이름으로 교체
                if(node.nodeValue.trim()==="User" && parent.children.length<=2){
                  // console.log("User ->", name, "교체", parent);
                  node.nodeValue = name;
                }
              }
            }
          }
        }
        // 특정 ID나 클래스가 있으면 직접 교체
        const candidates = document.querySelectorAll('[data-telegram-user], .telegram-user-name, #telegramUserName, #userName');
        candidates.forEach(el=>{ el.textContent = name; });
      };
      // 즉시 + 주기적 실행
      replaceUserText();
      setInterval(replaceUserText, 1500);
      setTimeout(replaceUserText, 500);
      setTimeout(replaceUserText, 2000);
      // 타이틀에 이름 표시
      try{
        const titleEl = document.querySelector('title');
        if(titleEl && name!=="User") document.title = name + " - 매매확인";
      }catch(e){}
    }catch(e){}
  }

  // 초기화 - Telegram 정보 자동 인식
  getTelegramUserInfo();
  // Telegram WebApp 이벤트 대기 - initData 로드 후 재시도
  try{
    if(window.Telegram?.WebApp){
      window.Telegram.WebApp.onEvent && window.Telegram.WebApp.onEvent('viewportChanged', ()=>{ getTelegramUserInfo(); });
    }
  }catch(e){}
  setTimeout(getTelegramUserInfo, 800);
  setTimeout(getTelegramUserInfo, 2000);

  // ===== 4. 텔레그램 신청 데이터 열람 제한 =====
  function enforceTelegramDataIsolation(){
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith("MNQ_TELEGRAM_APPLY_") && !k.includes(REAL_USER_ID) && !k.includes(REAL_ADMIN_ID) && !k.includes("USER_1")){
        console.warn("[텔레그램 보안] 타인 신청 데이터 접근 차단:", k);
      }
    });
  }

  // 신청 데이터 저장 - 실제 이름+닉네임+ID 자동 태깅 (입력 없이)
  window.saveTelegramApplyData = function(data){
    const tgInfo = getTelegramUserInfo() || window.TELEGRAM_USER_INFO || {};
    const tagged = {
      ...data,
      userId: REAL_USER_ID,
      telegram_id: tgInfo.telegram_id || tgInfo.id || null,
      first_name: tgInfo.first_name || "",
      last_name: tgInfo.last_name || "",
      username: tgInfo.username || "",
      username_with_at: tgInfo.username_with_at || "",
      real_name: tgInfo.real_name || tgInfo.displayName || data.name || "User",
      nickname: tgInfo.nickname || tgInfo.username_with_at || tgInfo.displayName || "User",
      displayName: tgInfo.displayName || tgInfo.real_name || "User",
      name: tgInfo.displayName || tgInfo.real_name || data.name || "User", // 매매확인에 표시될 이름
      adminId: REAL_ADMIN_ID,
      account: REAL_ACCOUNT,
      symbol: REAL_SYMBOL,
      timestamp: new Date().toISOString(),
      allowedViewers: [REAL_USER_ID, REAL_ADMIN_ID, "USER_1"], // 본인+관리자만 (호환성)
      realTrade: true
    };
    localStorage.setItem("MNQ_TELEGRAM_APPLY_" + REAL_USER_ID + "_" + Date.now(), JSON.stringify(tagged));
    fetch(REAL_NPOINT_URL).then(r=>r.json()).then(central=>{
      if(!central.telegram_applies) central.telegram_applies = {};
      if(!central.telegram_applies[REAL_USER_ID]) central.telegram_applies[REAL_USER_ID] = [];
      central.telegram_applies[REAL_USER_ID].push(tagged);
      // 호환성 - USER_1 키에도 저장
      if(!central.telegram_applies["USER_1"]) central.telegram_applies["USER_1"] = [];
      central.telegram_applies["USER_1"].push(tagged);
      localStorage.setItem("MNQ_NPOINT_CENTRAL_CACHE", JSON.stringify(central));
      console.log("[텔레그램] 신청 데이터 저장 - 실제 이름 자동 태깅:", tagged.real_name, tagged.nickname, tagged.telegram_id);
    }).catch(()=>{});
    return tagged;
  };

  // ===== 5. 텔레그램 설정값 -> User-PC 통신 + 실제 이름 포함 =====
  window.syncTelegramSettingsToUserPC = async function(settings, toggles){
    const tgInfo = getTelegramUserInfo() || window.TELEGRAM_USER_INFO || {};
    const payload = {
      userId: REAL_USER_ID,
      telegram_id: tgInfo.telegram_id || tgInfo.id || null,
      real_name: tgInfo.real_name || tgInfo.displayName || "",
      nickname: tgInfo.nickname || tgInfo.username_with_at || "",
      displayName: tgInfo.displayName || tgInfo.real_name || "",
      username: tgInfo.username || "",
      settings: settings,
      toggles: toggles,
      timestamp: new Date().toISOString(),
      account: REAL_ACCOUNT,
      symbol: REAL_SYMBOL,
      realTrade: true,
      pointValue: REAL_POINT_VALUE,
      fee: REAL_FEE
    };
    // npoint telegram_settings에 저장 -> User-PC가 3초마다 폴링
    try{
      const res = await fetch(REAL_NPOINT_URL);
      const central = await res.json();
      if(!central.telegram_settings) central.telegram_settings = {};
      central.telegram_settings[REAL_USER_ID] = payload;
      localStorage.setItem("MNQ_NPOINT_CENTRAL_CACHE", JSON.stringify(central));
      localStorage.setItem("MNQ_TELEGRAM_LAST_SYNC_"+REAL_USER_ID, payload.timestamp);
      console.log("[텔레그램] 설정값 User-PC로 전송:", payload);
      // 로그
      if(window._appSetters && window._appSetters.addLog){
        // 텔레그램 폼 내부 로그 함수가 있으면 호출
      }
      // 시각적 피드백
      const el = document.getElementById('tgSyncStatus');
      if(el) el.textContent = "동기화 완료 " + new Date().toLocaleTimeString();
    }catch(e){
      console.error("텔레그램 설정 동기화 실패", e);
    }
  };

  // 기존 설정 변경 시 자동 User-PC로 전송되도록 오버라이드
  // 예: maxLossAmount 변경 시
  function hookSettingsChanges(){
    // 모든 input 변경 감지
    document.addEventListener('change', function(e){
      if(e.target && (e.target.id.includes('maxLoss') || e.target.id.includes('initialCapital') || e.target.id.includes('posClose') || e.target.id.includes('nasdaq'))){
        // 설정값 수집
        const settings = {};
        try{
          const getVal = (id)=>{ const el=document.getElementById(id); return el?parseFloat(el.value)||0:0; };
          settings.maxLossAmount = getVal('maxLossAmount');
          settings.maxLossPercent = getVal('maxLossPercent');
          settings.maxTradeCount = getVal('maxTradeCount');
          settings.initialCapital = getVal('initialCapital');
          // ... 기타
        }catch(e2){}
        window.syncTelegramSettingsToUserPC(settings, {});
      }
    });
  }

  // 주기적 격리 강제 + 설정 동기화 상태 표시
  setInterval(enforceTelegramDataIsolation, 10000);
  setTimeout(()=>{ enforceTelegramDataIsolation(); hookSettingsChanges(); }, 2000);

  console.log("[REAL LINKAGE] Telegram 실거래 연계 5원칙 적용 - 본인+관리자만 열람, 설정값 User-PC 공유");
})();
